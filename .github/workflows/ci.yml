name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository; nothing here needs to push, comment or
# publish, so the token gets no more than that.
permissions:
  contents: read

env:
  # mcp_server rate-limits consent dialogs (a defence against a looping assistant).
  # The standalone test scripts below open far more than eight FAKE ones in one process.
  THYRA_VAULT_DIALOG_LIMIT: "0"

jobs:
  # The path users actually get: Windows, dependencies installed from the
  # hash-pinned lockfile via --require-hashes, exactly as plugin_launcher.py
  # does on first run. If this job breaks, installs break.
  tests-shipped-path:
    name: tests (windows, hash-pinned lockfile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Install pytest
        run: python -m pip install pytest

      # Both runners, because they collect differently: the standalone scripts
      # sweep globals() for callables named test_*, pytest uses its own
      # collection. A test can pass under one and not be seen by the other.
      - name: Run standalone
        run: |
          python tests/test_trust.py
          python tests/test_install_migrate_robustness.py
          python tests/test_trust_hardening.py
          python tests/test_store_hardening.py
          python tests/test_uihelpers.py
          python tests/test_redaction.py
          python tests/test_crypto_v2.py
          python tests/test_vault_format.py
          python tests/test_store_v2.py
          python tests/test_uihelpers_policy.py
          python tests/test_manage_vault.py
          python tests/test_integration_v2.py
          python tests/test_security_invariants.py
          python tests/test_consumption_matrix.py
          python tests/test_hardening_161.py
          python tests/test_single_view.py

      - name: Run under pytest
        run: python -m pytest -q


  # Broader Python compatibility against the NEWEST dependency releases, unpinned: an early
  # warning when a new release of a dependency breaks us. Not the shipped path (that is the
  # hash-locked install above); a failure here is a compatibility signal, not a broken release.
  tests-compat:
    name: tests (py${{ matrix.python-version }}, unpinned)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run under pytest
        run: python -m pytest -q

  # Local file check, no auth needed -- catches a malformed manifest before a
  # user hits it at install time.
  validate-plugin:
    name: validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json --strict

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      # The plugin ships as a git clone, so anything tracked is shipped.
      - name: Assert no generated artifacts are tracked
        run: |
          if git ls-files --error-unmatch llm.env 2>/dev/null; then
            echo "::error::llm.env is tracked and would ship to every install"
            exit 1
          fi
          echo "ship list clean"

  # The hash-locked install is the shipped path on EVERY platform now, not just Windows:
  # prove the universal lockfile resolves and the code that matters runs from it. (The
  # full suite still has Windows-oriented tests, so this runs the platform-independent
  # ones; the Windows job above runs everything.)
  tests-lock-posix:
    name: tests (${{ matrix.os }}, hash-pinned lockfile)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run the platform-independent suites
        run: >
          python -m pytest -q
          tests/test_crypto_v2.py tests/test_store_v2.py tests/test_vault_format.py
          tests/test_unlock_throttle.py tests/test_items.py tests/test_datadir.py
          tests/test_appflow.py tests/test_appflow_items.py tests/test_clipboard.py
          tests/test_webui_flows.py tests/test_webui_server.py tests/test_mcp_over_browser.py
          tests/test_security_review_fixes.py

  # thyra_vault/web_dist is a committed build of web/. Rebuild it from the lockfile and
  # fail if it differs, so the page that ships is provably the page in the source.
  web-bundle-matches-source:
    name: shipped page matches web/ source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@10.15.1

      - name: Install web dependencies (no install scripts)
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild the page
        working-directory: web
        run: pnpm build:embed

      - name: Fail if the committed page differs
        run: |
          if [ -n "$(git status --porcelain -- thyra_vault/web_dist)" ]; then
            git status --porcelain -- thyra_vault/web_dist
            echo "::error::thyra_vault/web_dist does not match a clean build of web/. Run 'pnpm build:embed' in web/ and commit."
            exit 1
          fi
          echo "shipped page is exactly what web/ builds"
